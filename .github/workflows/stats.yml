name: Update README stats cards

# Generates the two stats cards in profile/ with this account's own token,
# so private and organization repositories are counted too.
#
# METRICS_TOKEN: classic personal access token with the scopes
#   repo, read:user, read:org
# stored under Settings -> Secrets and variables -> Actions.
# Without that secret the cards fall back to public data only.

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/stats.yml

concurrency:
  group: readme-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Which repositories count: own ones, organization ones (getkobe,
      # LUMISystems, ...) and ones where access was granted as collaborator.
      ROLES: OWNER,ORGANIZATION_MEMBER,COLLABORATOR
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&role=${{ env.ROLES }}&include_all_commits=true&show_icons=true&hide_title=true&hide_border=true&line_height=21&text_color=000&icon_color=000&bg_color=0,ea6161,ffc64d,fffc4d,52fa5a&theme=graywhite
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&role=${{ env.ROLES }}&layout=compact&langs_count=6&hide=html&exclude_repo=TryHackMe-auf-Crack-&hide_title=true&hide_border=true&text_color=000&icon_color=fff&bg_color=0,52fa5a,4dfcff,c64dff&theme=graywhite
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
